name: Live API tests

# Runs the end-to-end live suite against the real Mixlayer API (free models only).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Live tests (free models)
        working-directory: parity/e2e
        env:
          MIXLAYER_API_KEY: ${{ secrets.MIXLAYER_API_KEY }}
          MIXLAYER_E2E_BIN: ${{ github.workspace }}/target/release/mxl
        run: go test -tags live -count=1 -v .
