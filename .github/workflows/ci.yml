name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Generated files are current
        if: runner.os == 'Linux'
        run: |
          python3 parity/gen_spec.py
          python3 parity/gen_help.py
          git diff --exit-code
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Install script
        if: runner.os != 'Windows'
        run: |
          if command -v shellcheck >/dev/null; then shellcheck install.sh scripts/*.sh; fi
          sh scripts/test-install.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: End-to-end suite against the release binary
        shell: bash
        working-directory: parity/e2e
        run: |
          bin="$GITHUB_WORKSPACE/target/release/mixlayer"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          MIXLAYER_E2E_BIN="$bin" go test -count=1 -v .

  cross-build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-zigbuild (Linux cross targets)
        if: runner.os == 'Linux'
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Smoke test the static Linux build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          b=target/${{ matrix.target }}/release
          file $b/mixlayer | grep -q 'statically linked'
          $b/mixlayer version
          $b/mixlayer agent-context > /dev/null
          $b/mixlayer shield redact docs/demo/customers.csv --mask-columns customer,company | head -2
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | $b/mixlayer-mcp | grep -q '"Mixlayer"'
