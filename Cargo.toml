[package]
name = "mixlayer"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
description = "The official command-line tool for Mixlayer: run open models like DeepSeek, Qwen and GLM from your terminal and your coding agent"
license = "Apache-2.0"
repository = "https://github.com/mixlayer/cli"
default-run = "mxl"

[[bin]]
name = "mxl"
path = "src/main.rs"

[[bin]]
name = "mxl-mcp"
path = "src/bin/mxl-mcp.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.4", features = ["env", "string"] }
clap_complete = "4.5"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
csv = "1"
getrandom = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.9"
toml_edit = "0.25.13"
url = "2"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }
schemars = "1"

[target.'cfg(unix)'.dependencies]
# `keys mint` must ignore terminal signals until it has deleted the temporary key.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# File identity (volume + file index) to detect hard links, like Go's os.SameFile.
same-file = "1"
